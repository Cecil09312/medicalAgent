<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文医疗问答助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶置医疗免责声明 banner -->
    <div class="disclaimer-banner" id="disclaimerBanner">
        <svg class="banner-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M12 2L1 21h22L12 2zm0 6l7.5 13h-15L12 8zm-1 4v4h2v-4h-2zm0 5v2h2v-2h-2z"/>
        </svg>
        <span>医疗免责声明：本助手由 AI 模型生成回答，仅供健康科普参考，不能替代执业医师的面对面诊断与治疗。如身体不适请及时就医。</span>
    </div>

    <div class="app">
        <!-- 顶部栏：标题 + 模型切换 + 状态 + 清空 -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 8h-2V3H7v5H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2zm-9 10v-3H7v-2h3v-3h2v3h3v2h-3v3h-2zm0-10V5h4v3h-4z"/>
                    </svg>
                </div>
                <h1 class="app-title">中文医疗问答助手</h1>
            </div>
            <div class="header-right">
                <!-- 微调前 / 微调后 切换 -->
                <div class="model-switch" role="group" aria-label="模型切换">
                    <button type="button" class="model-btn active" data-model="merged">微调后</button>
                    <button type="button" class="model-btn" data-model="base">微调前</button>
                </div>
                <span class="status-dot" id="statusDot" title="服务状态">
                    <span class="dot"></span><span class="status-text" id="statusText">检测中</span>
                </span>
                <button type="button" class="clear-btn" id="clearBtn" title="清空当前对话">
                    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                        <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                    清空对话
                </button>
            </div>
        </header>

        <!-- 聊天区域 -->
        <main class="chat-area" id="chatArea">
            <!-- 欢迎页（首次进入 / 清空后展示） -->
            <div class="welcome" id="welcome">
                <div class="welcome-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="36" height="36">
                        <path fill="currentColor" d="M19 8h-2V3H7v5H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2zm-9 10v-3H7v-2h3v-3h2v3h3v2h-3v3h-2zm0-10V5h4v3h-4z"/>
                    </svg>
                </div>
                <h2>您好，我是中文医疗问答助手</h2>
                <p class="welcome-desc">基于 Qwen2.5-7B + QLoRA 中文医疗数据微调，覆盖内科、外科、儿科、妇产科、男科、肿瘤科等常见健康问题。</p>
                <p class="welcome-tip">您可以试试以下问题：</p>
                <div class="example-list">
                    <button type="button" class="example-chip">我最近总是感觉头晕，可能是什么原因？</button>
                    <button type="button" class="example-chip">孩子半夜发烧到38.5度，家里该怎么处理？</button>
                    <button type="button" class="example-chip">长期高血压患者日常需要注意什么？</button>
                    <button type="button" class="example-chip">胃经常不舒服，和饮食习惯有关系吗？</button>
                </div>
            </div>
            <!-- 消息列表由 app.js 动态追加 -->
        </main>

        <!-- 输入区域 -->
        <footer class="input-area">
            <div class="input-box">
                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="请描述您的健康问题，按 Enter 发送，Shift + Enter 换行"
                    maxlength="2000"></textarea>
                <button type="button" class="send-btn" id="sendBtn" title="发送">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
                <button type="button" class="stop-btn hidden" id="stopBtn" title="停止生成">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M6 6h12v12H6z"/>
                    </svg>
                    停止
                </button>
            </div>
            <p class="input-hint">内容由 AI 生成，仅供参考，不能替代医生诊断。</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
